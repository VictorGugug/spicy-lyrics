# Configuración Nginx para review.tx24.dev
server {
    listen 80;
    listen [::]:80;
    server_name review.tx24.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name review.tx24.dev;

    # Certificados SSL (ajusta las rutas según certbot/cloudflare)
    # ssl_certificate /etc/letsencrypt/live/review.tx24.dev/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/review.tx24.dev/privkey.pem;

    # Ocultar versión de Nginx (lo que recomendó Spikerko)
    server_tokens off;

    # Directorio donde subas los archivos compilados
    root /var/www/review.tx24.dev;
    index index.html;

    # Cabeceras CORS indispensables para que Spotify cargue el módulo
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Configuración de tipos MIME para que reconozca .mjs y version como texto plano
    location /version {
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
